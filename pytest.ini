[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Default: skip integration tests that need a real FreeCAD.
# ``--strict-markers`` catches typos in @pytest.mark.X so an
# undeclared marker fails the suite instead of silently being
# ignored by -m filtering.
addopts = -ra -q -m "not freecad" --strict-markers
filterwarnings =
    ignore::DeprecationWarning
markers =
    freecad: integration tests that require a running FreeCAD with the addon loaded (skipped by default)
    slow: tests that take more than 1 second (skipped by default in fast mode)
    asyncio: tests that exercise asyncio code paths